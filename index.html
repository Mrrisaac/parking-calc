<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Fee Calculator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: darkgreen;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input[type="number"], input[type="date"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    input[type="checkbox"] {
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h2>Glenwood Parking Contract Calculator</h2>
  <label for="monthlyRate">Monthly Rate Before Tax ($):</label>
  <input type="number" id="monthlyRate" step="0.01" />

  <label for="startDate">Start Date:</label>
  <input type="date" id="startDate" />

  <label>
    <input type="checkbox" id="oversized" onclick="toggleOther('oversizedPlus', this)" /> Oversized Vehicle (+$84.48)
  </label>

  <label>
    <input type="checkbox" id="oversizedPlus" onclick="toggleOther('oversized', this)" /> Oversized Vehicle (+$105.60)
  </label>

  <label>
    <input type="checkbox" id="excludeLastMonth" /> Do not include Last Month Rate
  </label>

  <label>
    <input type="checkbox" id="useReducedTax" /> Excel - Briar Hill Only (10.375% tax)
  </label>

  <button onclick="calculateTotal()">Calculate</button>

  <div class="result" id="result"></div>

  <script>
    function toggleOther(otherId, current) {
      const other = document.getElementById(otherId);
      if (current.checked) other.checked = false;
    }

    function calculateTotal() {
      let monthlyRate = parseFloat(document.getElementById("monthlyRate").value);
      const startDateStr = document.getElementById("startDate").value;
      if (!startDateStr) { document.getElementById("result").innerText = "Please pick a start date."; return; }
      // Parse as LOCAL date to avoid UTC timezone shifts (which caused Oct 1 to show as Sep 30 in some timezones)
      const [yy, mm, dd] = startDateStr.split('-').map(Number);
      const startDate = new Date(yy, mm - 1, dd);
      const isOversized = document.getElementById("oversized").checked;
      const isOversizedPlus = document.getElementById("oversizedPlus").checked;
      const excludeLastMonth = document.getElementById("excludeLastMonth").checked;
      const useReducedTax = document.getElementById("useReducedTax").checked;

      if (isNaN(monthlyRate) || isNaN(startDate.getTime())) {
        document.getElementById("result").innerText = "Please enter valid inputs.";
        return;
      }

      const oversizedCharge = (isOversized ? 84.48 : 0) + (isOversizedPlus ? 105.60 : 0);

      const startDay = dd; // use parsed day to avoid timezone-related off-by-one
      // Use the actual number of days in the selected month (28, 29, 30, or 31)
      const daysInMonth = new Date(yy, mm, 0).getDate();
      const prorateDays = startDay === 1 ? 0 : (daysInMonth - startDay + 1);
      const proratedAmount = ((monthlyRate + oversizedCharge) * prorateDays) / daysInMonth;
      const lastMonthRate = excludeLastMonth ? 0 : monthlyRate;
      const taxRate = useReducedTax ? 0.10375 : 0.18375;

      const monthlyRateTaxedRaw = (monthlyRate + oversizedCharge) * (1 + taxRate);
      const monthlyRateTaxed = Math.round(monthlyRateTaxedRaw).toFixed(2);
      const proratedAmountTaxedRaw = proratedAmount * (1 + taxRate);
      const proratedAmountTaxed = proratedAmountTaxedRaw > 0 ? proratedAmountTaxedRaw.toFixed(2) : '0.00';
      const lastMonthRateTaxedRaw = (lastMonthRate + oversizedCharge) * (1 + taxRate);
      const lastMonthRateTaxed = Math.round(lastMonthRateTaxedRaw).toFixed(2);

      // Business rule: Include Monthly only on the 1st OR from the 20th to end of month
      const includeMonthly = (startDay === 1) || (startDay >= 20);
      const monthlyShownPre = includeMonthly ? monthlyRate.toFixed(2) : '0.00';
      const monthlyShownTaxed = includeMonthly ? monthlyRateTaxed : '0.00';

      const totalWithTax = (
        (includeMonthly ? parseFloat(monthlyRateTaxed) : 0) +
        parseFloat(proratedAmountTaxed) +
        parseFloat(lastMonthRateTaxed)
      ).toFixed(2);

      document.getElementById("result").innerHTML = `
        <strong>Summary:</strong>
        <table>
          <tr><th>Description</th><th>Pre-Tax</th><th>With Tax</th></tr>
          <tr><td>Monthly Rate</td><td>$${monthlyShownPre}</td><td>$${monthlyShownTaxed}</td></tr>
          <tr><td>Last Month Rate</td><td>$${lastMonthRate.toFixed(2)}</td><td>$${lastMonthRateTaxed}</td></tr>
          ${prorateDays > 0 ? `<tr><td>Prorated Amount</td><td>$${proratedAmount.toFixed(2)}</td><td>$${proratedAmountTaxed}</td></tr>` : ``}
          <tr><td>Oversized Charges</td><td>$${oversizedCharge.toFixed(2)}</td><td>$${Math.round(oversizedCharge * (1 + taxRate))}</td></tr>
        </table>
        <strong>Total with Tax (${(taxRate * 100).toFixed(3)}%): $${totalWithTax}</strong>
      `;
    }
  </script>
</body>
</html>
