<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parking Fee Calculator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: darkgreen;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input[type="number"], input[type="date"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    input[type="checkbox"] {
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h2>Glenwood Parking Contract Calculator</h2>
  <label for="monthlyRate">Monthly Rate Before Tax ($):</label>
  <input type="number" id="monthlyRate" step="0.01" />

  <label for="startDate">Start Date:</label>
  <input type="date" id="startDate" />

  <label>
    <input type="checkbox" id="oversized" onclick="toggleOther('oversizedPlus', this)" /> Oversized Vehicle (+$84.48)
  </label>

  <label>
    <input type="checkbox" id="oversizedPlus" onclick="toggleOther('oversized', this)" /> Oversized Vehicle (+$105.60)
  </label>

  <label>
    <input type="checkbox" id="excludeLastMonth" /> Do not include Last Month Rate
  </label>

  <label>
    <input type="checkbox" id="useReducedTax" /> Excel - Briar Hill Only (10.375% tax)
  </label>

  <button onclick="calculateTotal()">Calculate</button>

  <div class="result" id="result"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
